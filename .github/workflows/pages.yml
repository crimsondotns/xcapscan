name: Deploy to GitHub Pages

on:
  push:
    branches: [xcap-scan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ยกเลิกงานที่ค้างไม่ได้ช่วยอะไรกับ Pages: ตัว deployment ที่ถูกสร้างไปแล้วยังค้างอยู่ฝั่ง GitHub
# แล้วรันถัดไปจะเจอ "in progress deployment" — จึงให้รอคิวแทนการยกเลิก
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          VITE_SOURCES: ${{ secrets.SOURCES }}
          VITE_CHAIN_LIST_URL: ${{ secrets.CHAIN_LIST_URL }}
          VITE_CHAINS: ${{ secrets.CHAINS }}
          VITE_IPFS_GATEWAYS: 'https://gateway.pinata.cloud/ipfs/,https://cloudflare-ipfs.com/ipfs/,https://dweb.link/ipfs/,https://w3s.link/ipfs/,https://nftstorage.link/ipfs/'
          ALLOW_EMBEDDED_KEYS: '1'
      - run: pnpm check:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
