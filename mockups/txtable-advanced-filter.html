<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TxTable Advanced Filter</title>
<link rel="stylesheet" href="../src/styles/fonts.css">
<style>
/* Layout: control bar (variant · device · theme) above one device frame showing TxTable with that filter style */
:root{
  --color-bg:#fff;--color-ink:#000;--color-soft:#f1f1f1;--color-line:rgba(0,0,0,.12);--color-line-subtle:rgba(0,0,0,.08);
  --color-muted:rgba(0,0,0,.6);--color-tertiary:rgba(0,0,0,.44);--color-positive:#16a34a;--color-danger:#dc2626;
  --color-ink-hover:#262626;--color-hover:var(--color-soft);--color-line-hover:rgba(0,0,0,.32);
  --shadow-float:0 8px 28px rgba(0,0,0,.1),0 1px 4px rgba(0,0,0,.05);--color-scrim:rgba(0,0,0,.4);--stage:#e9e9e9;
  --font-sans:'Suisse Intl',-apple-system,BlinkMacSystemFont,sans-serif;
  --size-heading-sm:1.25rem;--size-body:1rem;--size-input:.9375rem;--size-label:.875rem;--size-caption:.8125rem;
  --radius-lg:12px;--radius-xl:16px;--radius-pill:9999px;--motion-base:180ms;--easing:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--color-bg:#171717;--color-ink:#f5f5f5;--color-soft:#262626;--color-line:rgba(255,255,255,.14);--color-line-subtle:rgba(255,255,255,.09);--color-muted:rgba(255,255,255,.66);--color-tertiary:rgba(255,255,255,.5);--color-positive:#4ade80;--color-danger:#f87171;--color-ink-hover:#d4d4d4;--color-hover:#303030;--color-line-hover:rgba(255,255,255,.4);--shadow-float:0 8px 28px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.35);--stage:#0e0e0e}}
:root[data-theme="dark"]{color-scheme:dark;--color-bg:#171717;--color-ink:#f5f5f5;--color-soft:#262626;--color-line:rgba(255,255,255,.14);--color-line-subtle:rgba(255,255,255,.09);--color-muted:rgba(255,255,255,.66);--color-tertiary:rgba(255,255,255,.5);--color-positive:#4ade80;--color-danger:#f87171;--color-ink-hover:#d4d4d4;--color-hover:#303030;--color-line-hover:rgba(255,255,255,.4);--shadow-float:0 8px 28px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.35);--stage:#0e0e0e}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--color-ink);font:400 var(--size-label)/1.45 var(--font-sans);padding-inline:16px;padding-block:20px 48px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-ink);outline-offset:2px}
.top{max-width:1320px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.top h1{font-size:var(--size-heading-sm);font-weight:600;margin:0}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--color-bg);border-radius:var(--radius-pill);box-shadow:0 0 0 1px var(--color-line);flex-wrap:wrap}
.seg button{border:0;background:none;height:34px;padding:0 14px;border-radius:var(--radius-pill);cursor:pointer;font-weight:500;color:var(--color-muted)}
.seg button:hover{background:var(--color-hover);color:var(--color-ink)}
.seg button[aria-pressed="true"]{background:var(--color-ink);color:var(--color-bg)}
.note{max-width:1320px;margin:0 auto 16px;color:var(--color-muted)}
.note b{color:var(--color-ink);font-weight:600}
.stage{max-width:1320px;margin:0 auto;overflow-x:auto;padding-bottom:8px}
.frame{margin:0 auto;background:var(--color-bg);border-radius:var(--radius-xl);box-shadow:0 0 0 1px var(--color-line);position:relative;overflow:hidden;min-height:640px}
.frame[data-d="mobile"]{width:390px;border-radius:28px;min-height:780px}
.frame[data-d="tablet"]{width:820px}
.frame[data-d="desktop"]{width:1280px}
.devlbl{text-align:center;color:var(--color-tertiary);font-size:var(--size-caption);margin-top:8px}

/* app chrome */
.app{--ctl:40px;padding:24px;display:flex;flex-direction:column;gap:16px}
[data-d="tablet"] .app{padding:16px}
[data-d="mobile"] .app{--ctl:48px;padding:12px;gap:12px}
.hdr{display:flex;align-items:center;gap:12px}
.hdr h2{margin:0;font-size:var(--size-heading-sm);font-weight:600;flex:1;min-width:0}
.btn{height:var(--ctl);min-height:40px;padding:0 16px;border-radius:var(--radius-pill);border:1px solid var(--color-line);background:var(--color-bg);font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;font-size:var(--size-label)}
.btn:hover{background:var(--color-hover);border-color:var(--color-line-hover)}
.btn.icon{width:var(--ctl);padding:0;justify-content:center}
.btn-primary{background:var(--color-ink);color:var(--color-bg);border-color:var(--color-ink)}
.btn-primary:hover{background:var(--color-ink-hover);border-color:var(--color-ink-hover)}
.btn-ghost{border-color:transparent}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-pill);background:var(--color-ink);color:var(--color-bg);font-size:var(--size-caption);font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn-primary .badge{background:var(--color-bg);color:var(--color-ink)}
.input{height:var(--ctl);border-radius:var(--radius-pill);border:1px solid var(--color-line);background:var(--color-bg);padding:0 16px;font:inherit;font-size:var(--size-input);color:var(--color-ink);min-width:0;width:100%}
.input:hover{border-color:var(--color-line-hover)}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:14px;color:var(--color-tertiary)}
.search .input{padding-left:40px}
.dd{height:var(--ctl);border-radius:var(--radius-pill);border:1px solid var(--color-line);background:var(--color-bg);padding:0 12px 0 16px;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;cursor:pointer;font-size:var(--size-label);width:100%;justify-content:space-between}
.dd:hover{border-color:var(--color-line-hover);background:var(--color-hover)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{color:var(--color-muted);margin-left:auto;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:32px;padding:0 6px 0 12px;border-radius:var(--radius-pill);background:var(--color-soft);display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:var(--size-caption);border:0;cursor:pointer}
.chip .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--color-muted)}
.chip:hover .x{background:var(--color-line);color:var(--color-ink)}
.chip.toggle{padding:0 12px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line)}
.chip.toggle[aria-pressed="true"]{background:var(--color-ink);color:var(--color-bg);box-shadow:none}
.chip.toggle:hover:not([aria-pressed="true"]){background:var(--color-hover)}
.link{background:none;border:0;color:var(--color-muted);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0 4px;height:32px}
.link:hover{color:var(--color-ink)}

/* filter form parts */
.fgrid{display:grid;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flbl{font-weight:600;font-size:var(--size-caption);color:var(--color-muted)}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.range span{color:var(--color-tertiary)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;font-weight:500}
.switch{width:40px;height:24px;border-radius:var(--radius-pill);background:var(--color-line-hover);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--color-bg);transition:transform var(--motion-base) var(--easing)}
.switch[aria-checked="true"]{background:var(--color-ink)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.sep{height:1px;background:var(--color-line-subtle)}

/* floating panel / sheet / rail */
.pop{position:absolute;z-index:5;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);border:1px solid var(--color-line-subtle);padding:20px;display:flex;flex-direction:column;gap:16px}
.scrim{position:absolute;inset:0;background:var(--color-scrim);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--color-bg);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:8px 16px 16px;display:flex;flex-direction:column;gap:16px;max-height:88%;overflow:auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--color-line-hover);margin:4px auto 0}
.sheet h3,.pop h3,.rail h3{margin:0;font-size:var(--size-body);font-weight:600}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.split{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.rail{display:flex;flex-direction:column;gap:20px;position:sticky;top:0}
.acc{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--color-line-subtle)}
.acc:last-child{border:0}
.acc>button{background:none;border:0;padding:0;display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer;min-height:32px}
.opt{display:flex;align-items:center;gap:10px;min-height:32px;font-weight:500;cursor:pointer;border-radius:8px;padding:0 6px;margin:0 -6px}
.opt:hover{background:var(--color-hover)}
.opt .n{margin-left:auto;color:var(--color-tertiary);font-weight:400}
.dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-line-hover);flex:none;display:grid;place-items:center}
.opt[aria-selected="true"] .dot{background:var(--color-ink);box-shadow:none}
.opt[aria-selected="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--color-bg)}
.fullscreen{position:absolute;inset:0;z-index:5;background:var(--color-bg);display:flex;flex-direction:column}
.fullscreen .body{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:16px}
.fullscreen .hd{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--color-line-subtle)}
.fullscreen .hd h3{flex:1;margin:0;font-size:var(--size-body);font-weight:600}
.fullscreen .ft{padding:12px 16px;border-top:1px solid var(--color-line-subtle);display:flex;gap:8px}
.fullscreen .ft .btn{flex:1;justify-content:center}

/* query builder */
.qb{background:var(--color-soft);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:72px 180px 150px 1fr 40px;gap:8px;align-items:center}
.qrow .w{font-weight:500;color:var(--color-muted);text-align:right}
.qrow .dd,.qrow .input{background:var(--color-bg)}
[data-d="tablet"] .qrow{grid-template-columns:56px 1fr 120px 1fr 40px}
.qcard{background:var(--color-bg);border-radius:var(--radius-lg);padding:12px;display:grid;gap:8px;position:relative}
.qcard .btn.icon{position:absolute;top:6px;right:6px;height:36px;width:36px;min-height:36px}
.qcard .w{font-weight:600;font-size:var(--size-caption);color:var(--color-muted)}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}

/* table */
.tablewrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--color-muted);font-size:var(--size-caption);padding:16px 12px;white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:12px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--color-hover)}
tbody tr td:first-child{border-radius:12px 0 0 12px}tbody tr td:last-child{border-radius:0 12px 12px 0}
.act{display:flex;align-items:center;gap:12px;min-width:0}
.tok{width:40px;height:40px;border-radius:50%;background:var(--color-soft);display:grid;place-items:center;font-weight:600;font-size:var(--size-caption);position:relative;flex:none}
.tok i{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--color-ink);color:var(--color-bg);font-style:normal;font-size:9px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--color-bg)}
.t1{font-weight:600}.t2{color:var(--color-muted);font-size:var(--size-caption);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{color:var(--color-positive);font-weight:500;white-space:nowrap}.out{color:var(--color-muted);font-size:var(--size-caption);white-space:nowrap}
.fee small{display:block;color:var(--color-tertiary);font-size:var(--size-caption)}
.sub{color:var(--color-muted);white-space:nowrap}
[data-d="mobile"] .colfee{display:none}
.mark{background:var(--color-soft);border-radius:4px;padding:0 3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.ddw{position:relative;min-width:0}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:max(100%,220px);z-index:30;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);border:1px solid var(--color-line-subtle);padding:6px;display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto}
.menu.right{left:auto;right:0}
.menu.pad{padding:14px;gap:12px}
.mi{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;background:none;border-radius:8px;cursor:pointer;font-weight:500;text-align:left;width:100%}
.mi:hover{background:var(--color-hover)}
.mi .ck{width:16px;flex:none;display:grid;place-items:center}
.mi .n{margin-left:auto;color:var(--color-tertiary);font-weight:400}
.dd .lbl{overflow:hidden;text-overflow:ellipsis}
.dd[aria-expanded="true"]{border-color:var(--color-ink)}
.dd.on{background:var(--color-soft)}
.th-btn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-weight:600}
.th-btn:hover{color:var(--color-ink)}
.th-btn .ar{opacity:.4}.th-btn[data-on] .ar{opacity:1}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);z-index:40;background:var(--color-bg);box-shadow:var(--shadow-float);display:flex;flex-direction:column}
.drawer .hd{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--color-line-subtle)}
.drawer .hd h3{flex:1;margin:0;font-size:var(--size-body);font-weight:600}
.drawer .bd{padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.kv{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--color-line-subtle);padding-bottom:12px}
.kv span:first-child{color:var(--color-muted)}.kv span:last-child{font-weight:500;text-align:right;word-break:break-all}
.big{font-size:var(--size-heading-sm);font-weight:600}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--color-ink);color:var(--color-bg);padding:10px 16px;border-radius:var(--radius-pill);font-weight:500;z-index:60;white-space:nowrap}
.empty{padding:48px 16px;text-align:center;color:var(--color-muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.skel td div{height:14px;border-radius:7px;background:var(--color-soft);animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.5}}
.sentinel{height:40px;display:grid;place-items:center;color:var(--color-tertiary)}
.flagtag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:var(--radius-pill);background:var(--color-soft);color:var(--color-danger);font-size:var(--size-caption);font-weight:600}
.failed .t1{color:var(--color-danger)}
.qrow{grid-template-columns:72px 190px 140px 1fr 40px}
.pop,.sheet,.menu,.drawer .bd,aside.rail,.fullscreen .body{overscroll-behavior:contain}
html.locked,html.locked body{overflow:hidden}
.cal{display:flex;flex-direction:column;gap:8px}
.calpop{position:absolute;z-index:70;width:320px;max-width:calc(100% - 24px);background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);border:1px solid var(--color-line-subtle);padding:14px}
.calpop .cal-hd .btn{background:var(--color-bg)}
.day.mid{background:var(--color-soft)!important}
.cal-hd{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.cal-hd .btn{height:36px;min-height:36px;width:36px;background:var(--color-bg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-hd .ttl{display:flex;gap:2px}
.cal-hd .ttl button{height:36px;padding:0 10px;border:0;background:none;border-radius:var(--radius-pill);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.cal-hd .ttl button:hover{background:var(--color-hover)}
.cal-hd .ttl button[aria-expanded="true"]{background:var(--color-soft)}
.ig{position:relative;min-width:0}
.ig .input{padding-right:48px}
.igbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:var(--radius-pill);background:none;color:var(--color-muted);display:grid;place-items:center;cursor:pointer}
.igbtn:hover{background:var(--color-hover);color:var(--color-ink)}
.igbtn[aria-expanded="true"]{background:var(--color-soft);color:var(--color-ink)}
.ig.bad .input{border-color:var(--color-danger)}
.dates{display:grid;gap:8px}
.dates .field>label{font-weight:500}
.cal-big{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cal-big .day{height:44px}
.cal-grid .wd{font-size:var(--size-caption);color:var(--color-tertiary);font-weight:500;padding:4px 0}
.day{height:40px;border:0;background:none;border-radius:var(--radius-pill);cursor:pointer;font-weight:500}
.day:hover:not(:disabled){background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line-hover)}
.day.mid{border-radius:0}
.day.sel{background:var(--color-ink);color:var(--color-bg)}
.day.sel:hover{background:var(--color-ink-hover)}
.day.today{box-shadow:inset 0 0 0 1px var(--color-ink)}
.day:disabled{color:var(--color-disabled,var(--color-tertiary));opacity:.45;cursor:default}
.day.out{visibility:hidden}
.cal-ft{display:flex;justify-content:space-between;align-items:center;color:var(--color-muted);font-size:var(--size-caption)}
</style>
</head>
<body>
<div class="top"><h1>TxTable · Advanced filter</h1><div class="seg" id="vseg" role="group" aria-label="Variant"></div><div class="seg" id="dseg" role="group" aria-label="Device"></div><div class="seg" id="tseg" role="group" aria-label="Theme"></div></div>
<p class="note" id="note"></p>
<div class="stage"><div class="frame" id="frame"></div></div>
<p class="devlbl" id="devlbl"></p>
<script>
const I={
 cal:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
 search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 filter:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
 x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
 back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>',
 plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
 trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 save:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>'
};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- sample data (deterministic) ---------- */
const NOW=new Date(2026,9,1,12,0).getTime();
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const pick=a=>a[Math.floor(rnd()*a.length)];

 if(type==='swap'){const to=sym==='USDC'?CH[chain].tok[0]:'USDC';legs.push({dir:'in',sym:to,qty:p?usdT/TOK[to].p:rnd()*900},{dir:'out',sym,qty});if(!p)usd=null}

 if(ts>=today.getTime())return `${Math.floor(m/60)} h ago`;if(ts>=today.getTime()-864e5)return `${hm}, yesterday`;

const PRESETS={'24h':['Last 24 h',1440],'7d':['Last 7 days',10080],'30d':['Last 30 days',43200],all:['Any time',Infinity],custom:['Custom',0]};
function pass(r,f,skip){
 if(f.q){const q=f.q.toLowerCase();if(![r.hash,r.wallet,r.cp,TOK[r.sym].n,CH[r.chain].n,typeLabel(r),...r.legs.map(l=>l.sym)].some(s=>s.toLowerCase().includes(q)))return false}
 if(skip!=='types'&&f.types.length&&!f.types.some(t=>t==='failed'?r.failed:(r.type===t&&!r.failed)))return false;
 if(f.dir==='in'&&!r.legs.some(l=>l.dir==='in'))return false;

 if(f.datePreset==='custom'){const a=pDate(f.dateFrom),b=pDate(f.dateTo,1);if(a&&r.ts<a)return false;if(b&&r.ts>b)return false}
 else if(PRESETS[f.datePreset]&&NOW-r.ts>PRESETS[f.datePreset][1]*60000)return false;
 const mn=num(f.amtMin),mx=num(f.amtMax);
 if((mn!=null||mx!=null)&&r.usd==null)return false;if(mn!=null&&r.usd<mn)return false;if(mx!=null&&r.usd>mx)return false;
 if(skip!=='wallets'&&f.wallets.length&&!f.wallets.includes(r.wallet))return false;
 if(skip!=='chains'&&f.chains.length&&!f.chains.includes(r.chain))return false;
 if(skip!=='tokens'&&f.tokens.length&&!r.legs.some(l=>f.tokens.includes(l.sym))&&!f.tokens.includes(r.sym))return false;
 const fmn=num(f.feeMin),fmx=num(f.feeMax);if(fmn!=null&&r.fee<fmn)return false;if(fmx!=null&&r.fee>fmx)return false;
 if(f.cp&&!r.cp.toLowerCase().includes(f.cp.toLowerCase()))return false;
 if(f.hideFlagged&&r.flagged)return false;if(f.onlyPrice&&!r.priced)return false;
 return true}
const names=(arr,map)=>arr.map(v=>map[v]||v).join(', ');
const CHN=Object.fromEntries(Object.entries(CH).map(([k,v])=>[k,v.n])),TYN=Object.fromEntries(TYPES);

  case'savePreset':S.ui.saving=true;S.ui.presetName=`My preset ${S.presets.length-3}`;draw();document.getElementById('in-ui-presetName')?.select();return;
  case'confirmSave':if(!S.ui.presetName.trim())return toast('Name required');S.presets.push({n:S.ui.presetName.trim(),rules:clone(S.rules)});S.ui.preset=S.presets.length-1;S.ui.saving=false;S.F=rulesToF(S.rules,S.F.q);return toast('Preset saved');
  case'calopen':{const key=`${t}:${k}`;if(S.ui.calOpen===key){S.ui.calOpen=null;break}S.ui.calOpen=key;S.ui.calView='day';const ts=pDate(S[t][k==='from'?'dateFrom':'dateTo'])||pDate(S[t][k==='from'?'dateTo':'dateFrom'])||DAY0,dd=new Date(ts);S.ui.cal={y:dd.getFullYear(),m:dd.getMonth(),yb:2015};break}break;
  case'calclose':S.ui.calOpen=null;break;
  case'calnav':{const c=S.ui.cal,vw=S.ui.calView;if(vw==='year')c.yb+=12*+v;else if(vw==='month')c.y+= +v;else{c.m+= +v;if(c.m<0){c.m=11;c.y--}if(c.m>11){c.m=0;c.y++}}break}
  case'calview':S.ui.calView=v;if(v==='year')S.ui.cal.yb=Math.min(S.ui.cal.y-5,2026-11);break;
  case'calpick':{const c=S.ui.cal;if(k==='y'){c.y=+v;if(c.y===2026&&c.m>9)c.m=9;S.ui.calView='month'}else{c.m=+v;S.ui.calView='day'}break}
  case'calday':{S[t][k==='from'?'dateFrom':'dateTo']=fmtD(+el.dataset.ts);S.ui.calOpen=null;resetPage();draw();document.getElementById(`calanchor-${t}-${k}`)?.focus();return}
  case'calclear':S[t].dateFrom=S[t].dateTo='';resetPage();break;
  case'cancelSave':S.ui.saving=false;break;
 }
 draw();
});
document.addEventListener('input',e=>{const p=e.target.dataset.in;if(!p)return;const [a,b]=p.split('.');
 if(e.target.dataset.calkey){const ts=pDate(e.target.value);if(ts){const dd=new Date(ts);S.ui.cal={...S.ui.cal,y:dd.getFullYear(),m:dd.getMonth()}}}
 if(a==='rule'){S.rules[+b].value=e.target.value;S.ui.preset=-1}else S[a][b]=e.target.value;
 S.ui.page=15;draw()});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'&&e.target.dataset.calkey){e.preventDefault();const [t,w]=e.target.dataset.calkey.split(':');if(S.ui.calOpen!==e.target.dataset.calkey)document.getElementById(`calanchor-${t}-${w}`).click();return}
 if(e.key==='Escape'){if(S.ui.calOpen)S.ui.calOpen=null;else if(S.ui.dd)S.ui.dd=null;else if(S.ui.detail!=null)S.ui.detail=null;else closeAll();draw()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act],.opt[data-act]')){e.preventDefault();e.target.click()}
 if(e.key==='Enter'&&e.target.id==='in-ui-presetName')document.querySelector('[data-act="confirmSave"]')?.click();
});
/* wheel over a floating panel never scrolls the page; inner scroll areas still scroll up to their edge */
document.addEventListener('wheel',e=>{const panel=e.target.closest('.calpop,.pop,.menu,.sheet,.drawer,aside.rail,.fullscreen');if(!panel)return;
 for(let el=e.target;el&&el!==panel.parentElement;el=el.parentElement){const oy=getComputedStyle(el).overflowY;
  if((oy==='auto'||oy==='scroll')&&el.scrollHeight>el.clientHeight){const up=e.deltaY<0;if(up?el.scrollTop>0:el.scrollTop+el.clientHeight<el.scrollHeight-1)return}}
 e.preventDefault()},{passive:false});
draw();
</script>
